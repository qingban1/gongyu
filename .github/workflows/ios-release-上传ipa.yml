name: Build and Distribute IPA via xcrun

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Prepare and upload IPA with xcrun
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare IPA
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(splitfile*)
          if (( ${#parts[@]} > 0 )); then
            echo "发现 ${#parts[@]} 个分片，开始合并。"
            cat "${parts[@]}" > "$RUNNER_TEMP/ipa_bundle.zip"
            unzip -tq "$RUNNER_TEMP/ipa_bundle.zip"
            mkdir -p "$RUNNER_TEMP/ipa_unpacked"
            unzip -oq "$RUNNER_TEMP/ipa_bundle.zip" -d "$RUNNER_TEMP/ipa_unpacked"
            unpacked_ipas=()
            while IFS= read -r -d '' file; do
              unpacked_ipas+=("$file")
            done < <(find "$RUNNER_TEMP/ipa_unpacked" -type f -name '*.ipa' -print0)
            if (( ${#unpacked_ipas[@]} != 1 )); then
              echo "错误：分片归档中应恰好包含一个 IPA，实际为 ${#unpacked_ipas[@]} 个。"
              exit 1
            fi
            cp "${unpacked_ipas[0]}" "$RUNNER_TEMP/Runner.ipa"
          else
            echo "未发现分片，查找仓库中的 IPA。"
            ipas=()
            while IFS= read -r -d '' file; do
              ipas+=("$file")
            done < <(find . -maxdepth 1 -type f -name '*.ipa' -print0)
            if (( ${#ipas[@]} != 1 )); then
              echo "错误：仓库根目录中应恰好包含一个 IPA，实际为 ${#ipas[@]} 个。"
              exit 1
            fi
            cp "${ipas[0]}" "$RUNNER_TEMP/Runner.ipa"
          fi
          unzip -tq "$RUNNER_TEMP/Runner.ipa"
          ls -lh "$RUNNER_TEMP/Runner.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/Runner.ipa" >> "$GITHUB_ENV"

      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA using xcrun altool
        shell: bash
        env:
          APPLE_USERNAME: 'JimmyDecesare63074@outlook.com'
          APPLE_PASSWORD: 'bmnj-dchz-zmhk-pywg'
        run: |
          set -euo pipefail
          
          # 检查是否使用了兼容 altool 的 Xcode 路径（若默认环境找不到 altool，可切到默认可用路径）
          echo "检查当前 Xcode 版本："
          xcodebuild -version
          
          # 如果默认的 macos-latest 找不到 altool，可以通过切换开发者目录来兼容（视 runner 上的 xcode 安装情况而定）
          # 默认调用系统的 xcrun altool
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --username "$APPLE_USERNAME" \
            --password "$APPLE_PASSWORD" \
            --verbose
